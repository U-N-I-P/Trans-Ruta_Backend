name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Aquí irían pruebas unitarias o linters en el futuro si se agregan
      # - name: Ejecutar pruebas
      #   run: pnpm test

      - name: Disparar Despliegue en Render
        if: github.ref == 'refs/heads/main' && success()
        run: |
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
